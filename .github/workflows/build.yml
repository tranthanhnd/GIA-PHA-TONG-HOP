name: "Build Gia Phả Việt - Bản Tổng Hợp"

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cài Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cài thư viện npm
        run: npm install

      - name: Build ứng dụng
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: tong-hop-v__VERSION__
          releaseName: "Gia Phả Việt v__VERSION__"
          releaseBody: "Bản cài đặt tự động cho Windows và macOS. Bản macOS hiện CHƯA được ký số Apple — người dùng cần vào System Settings > Privacy & Security để bấm Mở thủ công lần đầu."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
