name: "Build Gia Phả Việt - Bản Tổng Hợp"

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cài Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cài thư viện npm
        run: npm install

      - name: Build ứng dụng
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: tong-hop-v__VERSION__
          releaseName: "Gia Phả Việt v__VERSION__"
          releaseBody: "Bản cài đặt tự động cho Windows."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
